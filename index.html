<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINTED MEMORIES — Digital Yearbook</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="loading-screen">
        <div class="brush-container">
            <div class="brush-stroke stroke-1"></div>
            <div class="brush-stroke stroke-2"></div>
            <div class="brush-stroke stroke-3"></div>
        </div>
        <div class="loading-content">
            <h1 class="loading-title">Painted Memories</h1>
            <p class="loading-subtitle">Loading memories...</p>
        </div>
    </div>

    <!-- HERO SECTION -->
    <section id="hero" class="hero-section">
        <div class="hero-bg-parallax" id="heroBg"></div>
        <div class="hero-overlay"></div>

        <div class="hero-container">
            <span class="hero-badge" data-aos="fade-down">Class Journey 2023–2026</span>
            <h1 class="hero-title" data-aos="fade-up">PAINTED MEMORIES</h1>
            
            <div class="hero-chapters" data-aos="fade-up" data-aos-delay="100">
                <span class="chapter-item">SOFIA <small>(2023–2024)</small></span>
                <span class="chapter-arrow">↓</span>
                <span class="chapter-item">LATVIA <small>(2024–2025)</small></span>
                <span class="chapter-arrow">↓</span>
                <span class="chapter-item">MADRID <small>(2025–2026)</small></span>
            </div>

            <p class="hero-tagline" data-aos="fade-up" data-aos-delay="200">
                Every memory added a color.<br>Together they became our masterpiece.
            </p>

            <div class="hero-cta" data-aos="fade-up" data-aos-delay="300">
                <a href="#timeline" class="btn-glass">
                    <span>Begin Our Journey</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M12 6v12"/></svg>
                </a>
            </div>
        </div>

        <div class="scroll-indicator">
            <div class="mouse">
                <div class="wheel"></div>
            </div>
            <span>Scroll Down</span>
        </div>
    </section>

    <!-- Main JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
